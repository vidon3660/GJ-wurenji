x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  db:
    image: postgis/postgis:17-3.5
    platform: linux/amd64
    environment:
      POSTGRES_DB: wurenji
      POSTGRES_USER: wurenji
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wurenji -d wurenji"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    ports:
      - "${MINIO_API_PORT:-59000}:9000"
      - "${MINIO_CONSOLE_PORT:-59001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging

  onlyoffice:
    image: onlyoffice/documentserver:8.3.3
    profiles: ["office"]
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?ONLYOFFICE_JWT_SECRET is required}
      JWT_HEADER: Authorization
      ALLOW_PRIVATE_IP_ADDRESS: "true"
    ports:
      - "${ONLYOFFICE_PORT:-49080}:80"
    volumes:
      - onlyoffice-data:/var/www/onlyoffice/Data
      - onlyoffice-logs:/var/log/onlyoffice
      - ./data/onlyoffice/fonts:/usr/share/fonts/truetype/custom:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 30
    logging: *default-logging

  migrate:
    image: ${PLATFORM_IMAGE:-wurenji-platform:${PLATFORM_VERSION:-0.1.0}}
    platform: linux/amd64
    build:
      context: .
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-}
        PLATFORM_VERSION: ${PLATFORM_VERSION:-0.1.0}
        VITE_CESIUM_ION_TOKEN: ${VITE_CESIUM_ION_TOKEN:-}
        VITE_DEM_TERRAIN_URL: ${VITE_DEM_TERRAIN_URL:-}
        VITE_ENABLE_WORLD_IMAGERY: ${VITE_ENABLE_WORLD_IMAGERY:-true}
        VITE_ENABLE_WORLD_TERRAIN: ${VITE_ENABLE_WORLD_TERRAIN:-false}
        VITE_ENABLE_OSM_BUILDINGS: ${VITE_ENABLE_OSM_BUILDINGS:-false}
    command: ["node", "apps/server/dist/database/migrate.js"]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://wurenji:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/wurenji
      TYPEORM_SYNCHRONIZE: "false"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    logging: *default-logging

  app:
    image: ${PLATFORM_IMAGE:-wurenji-platform:${PLATFORM_VERSION:-0.1.0}}
    platform: linux/amd64
    build:
      context: .
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-}
        PLATFORM_VERSION: ${PLATFORM_VERSION:-0.1.0}
        VITE_CESIUM_ION_TOKEN: ${VITE_CESIUM_ION_TOKEN:-}
        VITE_DEM_TERRAIN_URL: ${VITE_DEM_TERRAIN_URL:-}
        VITE_ENABLE_WORLD_IMAGERY: ${VITE_ENABLE_WORLD_IMAGERY:-true}
        VITE_ENABLE_WORLD_TERRAIN: ${VITE_ENABLE_WORLD_TERRAIN:-false}
        VITE_ENABLE_OSM_BUILDINGS: ${VITE_ENABLE_OSM_BUILDINGS:-false}
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://wurenji:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/wurenji
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      PORT: 3000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      SIMULATION_DATA_DIR: /app/data/simulation-runs
      RESULT_DATA_DIR: /app/data/evaluation-results
      V3_FILE_STORAGE_DIR: /app/data/v3-files
      MAP_DATA_DIR: /app/data/map
      FORMAL_MAP_RESOURCES_REQUIRED: ${FORMAL_MAP_RESOURCES_REQUIRED:-false}
      V3_FILE_STORAGE_PROVIDER: ${V3_FILE_STORAGE_PROVIDER:-MINIO}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-wurenji}
      RESOURCE_PACKAGE_TRUSTED_KEYS_FILE: ${RESOURCE_PACKAGE_TRUSTED_KEYS_FILE:-/app/config/resource-trusted-keys.json}
      RESOURCE_PACKAGE_TRUSTED_KEYS_JSON: ${RESOURCE_PACKAGE_TRUSTED_KEYS_JSON:-}
      ONLYOFFICE_PUBLIC_URL: ${ONLYOFFICE_PUBLIC_URL:-http://localhost:49080}
      ONLYOFFICE_INTERNAL_URL: ${ONLYOFFICE_INTERNAL_URL:-http://onlyoffice}
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?ONLYOFFICE_JWT_SECRET is required}
      V3_INTERNAL_API_URL: http://app:3000/api
      V3_ALLOW_UNSIGNED_RESOURCE_REGISTRATION: "false"
      TYPEORM_SYNCHRONIZE: "false"
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      DEMO_TEACHER_PASSWORD: ${DEMO_TEACHER_PASSWORD:-}
      DEMO_STUDENT_PASSWORD: ${DEMO_STUDENT_PASSWORD:-}
      DEMO_STUDENT2_PASSWORD: ${DEMO_STUDENT2_PASSWORD:-}
      PLATFORM_VERSION: ${PLATFORM_VERSION:-0.1.0}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - simulation-data:/app/data/simulation-runs
      - evaluation-data:/app/data/evaluation-results
      - v3-file-data:/app/data/v3-files
      - ./data/map:/app/data/map:ro
      - ./config/resource-trusted-keys.json:/app/config/resource-trusted-keys.json:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/readyz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *default-logging

  worker:
    profiles: ["worker"]
    image: ${PLATFORM_IMAGE:-wurenji-platform:${PLATFORM_VERSION:-0.1.0}}
    platform: linux/amd64
    build:
      context: .
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-}
        PLATFORM_VERSION: ${PLATFORM_VERSION:-0.1.0}
        VITE_CESIUM_ION_TOKEN: ${VITE_CESIUM_ION_TOKEN:-}
        VITE_DEM_TERRAIN_URL: ${VITE_DEM_TERRAIN_URL:-}
        VITE_ENABLE_WORLD_IMAGERY: ${VITE_ENABLE_WORLD_IMAGERY:-true}
        VITE_ENABLE_WORLD_TERRAIN: ${VITE_ENABLE_WORLD_TERRAIN:-false}
        VITE_ENABLE_OSM_BUILDINGS: ${VITE_ENABLE_OSM_BUILDINGS:-false}
    command: ["node", "apps/server/dist/worker.js"]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://wurenji:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/wurenji
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      V3_FILE_STORAGE_DIR: /app/data/v3-files
      V3_FILE_STORAGE_PROVIDER: ${V3_FILE_STORAGE_PROVIDER:-MINIO}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-wurenji}
      RESOURCE_PACKAGE_TRUSTED_KEYS_FILE: ${RESOURCE_PACKAGE_TRUSTED_KEYS_FILE:-/app/config/resource-trusted-keys.json}
      RESOURCE_PACKAGE_TRUSTED_KEYS_JSON: ${RESOURCE_PACKAGE_TRUSTED_KEYS_JSON:-}
      V3_ALLOW_UNSIGNED_RESOURCE_REGISTRATION: "false"
      TYPEORM_SYNCHRONIZE: "false"
      JOB_RETRY_BASE_DELAY_MS: ${JOB_RETRY_BASE_DELAY_MS:-1000}
      JOB_RETRY_MAX_DELAY_MS: ${JOB_RETRY_MAX_DELAY_MS:-300000}
      JOB_LEASE_DURATION_MS: ${JOB_LEASE_DURATION_MS:-30000}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-500}
      WORKER_ERROR_DELAY_MS: ${WORKER_ERROR_DELAY_MS:-5000}
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-20}
      WORKER_HEALTH_MAX_AGE_MS: ${WORKER_HEALTH_MAX_AGE_MS:-120000}
      WORKER_HEALTH_FILE: /tmp/wurenji-worker-health.json
    volumes:
      - v3-file-data:/app/data/v3-files
      - ./config/resource-trusted-keys.json:/app/config/resource-trusted-keys.json:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "apps/server/dist/worker-healthcheck.js"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    stop_grace_period: 2m
    restart: unless-stopped
    logging: *default-logging

  map-service:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    profiles: ["production"]
    volumes:
      - ./data/map:/usr/share/nginx/html/map:ro
      - ./deploy/nginx/map.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/map-healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging: *default-logging

  backup:
    profiles: ["backup"]
    image: ${BACKUP_IMAGE:-wurenji-backup:${PLATFORM_VERSION:-0.1.0}}
    build:
      context: .
      dockerfile: Dockerfile.backup
      args:
        PLATFORM_VERSION: ${PLATFORM_VERSION:-0.1.0}
    entrypoint: ["node", "scripts/backup.mjs"]
    command: ["help"]
    environment:
      DATABASE_URL: postgresql://wurenji:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/wurenji
      PLATFORM_VERSION: ${PLATFORM_VERSION:-0.1.0}
      V3_FILE_STORAGE_PROVIDER: ${V3_FILE_STORAGE_PROVIDER:-MINIO}
      V3_FILE_STORAGE_DIR: /app/data/v3-files
      SIMULATION_DATA_DIR: /app/data/simulation-runs
      RESULT_DATA_DIR: /app/data/evaluation-results
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-wurenji}
      PG_TOOLS_MODE: native
    volumes:
      - simulation-data:/app/data/simulation-runs
      - evaluation-data:/app/data/evaluation-results
      - v3-file-data:/app/data/v3-files
      - ./data/backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    logging: *default-logging

  gateway:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    profiles: ["production"]
    ports:
      - "${GATEWAY_HTTP_PORT:-80}:80"
      - "${GATEWAY_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:-./deploy/certs}:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy
      map-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/gateway-healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging: *default-logging

volumes:
  postgres-data:
  simulation-data:
  evaluation-data:
  v3-file-data:
  minio-data:
  onlyoffice-data:
  onlyoffice-logs:
